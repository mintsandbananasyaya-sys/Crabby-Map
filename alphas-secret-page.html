<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coordinate Finder</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #0d1b2a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 20px;
    text-align: center;
  }

  h1 {
    margin-bottom: 8px;
  }

  p.hint {
    color: #99a9bb;
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 18px;
  }

  #readout {
    max-width: 900px;
    margin: 0 auto 16px auto;
    background: #14283d;
    border: 1px solid #3a5068;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 16px;
    font-family: 'Courier New', monospace;
    min-height: 22px;
  }

  #readout.copied {
    color: #7CFC7C;
  }

  .map-container {
    display: flex;
    justify-content: center;
  }

  .map-viewport {
    position: relative;
    display: inline-block;
    max-width: 100%;
    width: 900px;
    border: 2px solid #ffffff;
    border-radius: 8px;
    overflow: hidden;
  }

  .map-viewport img {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
    -webkit-user-drag: none;
    user-select: none;
  }

  .crosshair-dot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #ff3b3b;
    border: 2px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<h1>Coordinate Finder</h1>
<p class="hint">Click anywhere on the map to get its x / y percentage. Click again elsewhere to update.</p>

<div id="readout">Click the map to begin...</div>

<div class="map-container">
  <div class="map-viewport" id="mapViewport">
    <img src="map.png" alt="Minecraft Map" id="mapImage" draggable="false">
    <div class="crosshair-dot" id="crosshairDot"></div>
  </div>
</div>

<script>
  const mapImage = document.getElementById('mapImage');
  const readout = document.getElementById('readout');
  const crosshairDot = document.getElementById('crosshairDot');

  mapImage.addEventListener('click', (e) => {
    const rect = mapImage.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width) * 100;
    const yPct = ((e.clientY - rect.top) / rect.height) * 100;

    const snippet = `x: ${xPct.toFixed(1)}, y: ${yPct.toFixed(1)},`;

    readout.textContent = snippet;
    console.log(snippet);

    crosshairDot.style.left = xPct + '%';
    crosshairDot.style.top = yPct + '%';
    crosshairDot.style.display = 'block';

    // Copy to clipboard for convenience
    if (navigator.clipboard) {
      navigator.clipboard.writeText(snippet).then(() => {
        readout.classList.add('copied');
        readout.textContent = snippet + '  (copied to clipboard)';
        setTimeout(() => readout.classList.remove('copied'), 800);
      }).catch(() => { /* clipboard may be blocked, ignore silently */ });
    }
  });
</script>

</body>
</html>
