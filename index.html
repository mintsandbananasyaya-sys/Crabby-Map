<title>Interactive Map</title>
<style>
  :root {
    --color-city: #ff1a1a;
    --color-monument: #2196F3;
    --color-building: #ffd700;
    --color-town: #8b2e2e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
 background: #0d1b2a;
    color: #ffffff;
    font-family: Arial, sans-serif;
 padding: 20px;
  }

  h1 {
  text-align: center;
    margin-bottom: 18px;
  }

    h2 {
  text-align: center;
    margin-bottom: 18px;
    color:#4752c4
  }

      h3 {
  text-align: center;
    margin-bottom: 18px;
    color:#4752c4
  }

  .controls {
    max-width: 900px;
 margin: 0 auto 16px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
 align-items: center;
    justify-content: center;
  }

  #searchInput {
    flex: 1 1 220px;
 max-width: 320px;
    padding: 8px 12px;
    border-radius: 6px;
border: 1px solid #3a5068;
    background: #14283d;
    color: #fff;
    font-size: 14px;
  }

  #searchInput:focus {
 outline: 2px solid #2196F3;
  }

  #searchResults {
    position: relative;
  }

  #coordDisplay {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(0,0,0,0.65);
  color: #ffffff;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 6px;
  z-index: 4;
  pointer-events: none;
}

  .search-dropdown {
position: absolute;
    top: 100%;
left: 0;
    right: 0;
    background: #14283d;
 border: 1px solid #3a5068;
 border-radius: 6px;
    margin-top: 4px;
    max-height: 200px;
 overflow-y: auto;
    z-index: 20;
text-align: left;
    display: none;
  }

  .search-dropdown.show { display: block; }

  .search-dropdown div {
    padding: 8px 12px;
 cursor: pointer;
    font-size: 14px;
  }

  .territory-shape {
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.territory-shape:hover {
  opacity: 0.55 !important;
}

.territory-shape.hidden-category {
  display: none;
}

  .search-dropdown div:hover {
    background: #1f3b57;
  }

  .info-panel .discord-btn {
  display: inline-block;
margin-top: 16px;
  background: #5865F2;
  color: #ffffff;
  text-decoration: none;
   font-weight: bold;
  font-size: 14px;
  padding: 10px 16px;
  border-radius: 6px;
text-align: center;
  width: 100%;
}

.info-panel .discord-btn:hover {
  background: #4752c4;
}

.info-panel .contact-text {
 margin-top: 16px;
  font-size: 14px;
  color: #cccccc;
  font-style: italic;
}

  .compass-label {
  position: absolute;
  color: #ffffff;
font-weight: bold;
  font-size: 18px;
  font-family: Arial, sans-serif;
text-shadow: 0 0 4px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.6);
  z-index: 3;
  pointer-events: none;
  user-select: none;
}

.compass-north { top: 8px;    left: 50%; transform: translateX(-50%); }
.compass-south { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass-east  { right: 8px;  top: 50%;  transform: translateY(-50%); }
.compass-west  { left: 8px;   top: 50%;  transform: translateY(-50%); }

  .legend {
    display: flex;
 flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .legend label {
    display: flex;
 align-items: center;
    gap: 6px;
    font-size: 13px;
cursor: pointer;
    background: #14283d;
    padding: 6px 10px;
    border-radius: 20px;
    border: 1px solid #3a5068;
    user-select: none;
  }

  .legend .swatch {
 width: 12px;
    height: 12px;
 border-radius: 50%;
    border: 2px solid white;
    display: inline-block;
  }

  .map-container {
    display: flex;
 justify-content: center;
  }

  .map-viewport {
    position: relative;
  display: inline-block;
    max-width: 100%;
  width: 900px;
    overflow: hidden;
 border: 2px solid #ffffff;
    border-radius: 8px;
    touch-action: none;
  }

  .map-inner {
    position: relative;
    transform-origin: 50% 50%;
    transition: transform 0.5s ease;
  }

  .map-inner.dragging {
    transition: none;
    cursor: grabbing;
  }

  .map-inner img {
    display: block;
width: 100%;
    height: auto;
    -webkit-user-drag: none;
    user-select: none;
  }

  .marker {
    position: absolute;
 width: 14px;
height: 14px;
    border: 2px solid white;
border-radius: 50%;
    cursor: pointer;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .marker.hidden-category {
    display: none;
  }

  .marker::after {
    content: '';
 position: absolute;
    inset: -2px;
border-radius: 50%;
    background: inherit;
    opacity: 0.6;
animation: pulse 2s infinite;
    z-index: -1;
  }

  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.6; }
70%  { transform: scale(2.4); opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .marker .tooltip {
visibility: hidden;
    opacity: 0;
    position: absolute;
bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
 background: rgba(0, 0, 0, 0.85);
    color: #fff;
    padding: 4px 8px;
  border-radius: 4px;
    font-size: 13px;
white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.1s ease;
  }

  .marker:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
z-index: 5;
    display: none;
  }

  .backdrop.active {
display: block;
  }

  .info-panel {
    position: fixed;
    top: 0;
 right: -360px;
    width: 320px;
  height: 100%;
    background: #14283d;
    border-left: 2px solid #ffffff;
  padding: 24px;
    text-align: left;
    transition: right 0.4s ease;
z-index: 10;
    overflow-y: auto;
  }

  .info-panel.open {
right: 0;
  }

  .info-panel .type-badge {
  display: inline-flex;
    align-items: center;
 gap: 6px;
    font-size: 12px;
  text-transform: uppercase;
    letter-spacing: 0.5px;
  color: #cccccc;
    margin-bottom: 4px;
  }

  .info-panel .type-badge .swatch {
  width: 10px;
    height: 10px;
 border-radius: 50%;
  border: 2px solid white;
    display: inline-block;
  }

  .info-panel h2 {
    margin-top: 4px;
    margin-bottom: 0;
  }

  .info-panel .label {
    font-weight: bold;
 margin-top: 16px;
    margin-bottom: 4px;
    color: #cccccc;
 font-size: 13px;
    text-transform: uppercase;
 letter-spacing: 0.5px;
  }

  .info-panel .value {
 font-size: 15px;
    line-height: 1.4;
  }

  .info-panel .location-image {
    width: 100%;
 height: auto;
    border-radius: 8px;
    margin-top: 16px;
  border: 1px solid #3a5068;
  display: none;
    cursor: zoom-in;
  }

  .info-panel .location-image.show {
 display: block;
  }

  .lightbox {
    position: fixed;
    inset: 0;
  background: rgba(0, 0, 0, 0.85);
    display: none;
 align-items: center;
    justify-content: center;
 z-index: 50;
    padding: 40px;
  }

  .lightbox.open {
display: flex;
  }

  .lightbox img {
    max-width: 100%;
max-height: 100%;
 border-radius: 8px;
    cursor: zoom-out;
 box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }

  .lightbox .lightbox-close {
    position: fixed;
    top: 20px;
 right: 28px;
    background: none;
    border: none;
  color: #ffffff;
 font-size: 32px;
    cursor: pointer;
    line-height: 1;
    z-index: 51;
  }

  .info-panel .close-btn {
 position: absolute;
    top: 16px;
 right: 16px;
    background: none;
    border: none;
color: #ffffff;
font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }

 @media (max-width: 700px) {
  .info-panel {
    top: auto;
    bottom: -100%;
    right: 0;
    left: 0;
    width: 100%;
    height: auto;
    max-height: 42vh;
    border-left: none;
    border-top: 2px solid #ffffff;
    border-radius: 12px 12px 0 0;
    transition: bottom 0.4s ease;
  }

  .info-panel.open {
    bottom: 0;
    right: 0;
  }
}

  const mapViewport = document.getElementById('mapViewport');
  const mapInner = document.getElementById('mapInner');
  const infoPanel = document.getElementById('infoPanel');
  const backdrop = document.getElementById('backdrop');
  const legend = document.getElementById('legend');
  const searchInput = document.getElementById('searchInput');
  const searchDropdown = document.getElementById('searchDropdown');

  let activeLocationId = null;
  let currentZoom = 1;
  let baseOffsetX = 0, baseOffsetY = 0;
  let panX = 0, panY = 0;
  let activeCategories = new Set(Object.keys(CATEGORIES));

  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const label = document.createElement('label');
    label.innerHTML = `
      <span class="swatch" style="background:${cat.color};"></span>
      ${cat.label}
    `;
    label.addEventListener('click', (e) => {
      e.preventDefault();
      if (activeCategories.has(key)) {
        activeCategories.delete(key);
        label.style.opacity = '0.4';
      } else {
        activeCategories.add(key);
        label.style.opacity = '1';
      }
      applyCategoryFilter();
    });
    legend.appendChild(label);
  });

  LOCATIONS.forEach(loc => {
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.id = 'marker-' + loc.id;
    marker.style.left = loc.x + '%';
    marker.style.top = loc.y + '%';
    marker.style.background = CATEGORIES[loc.type].color;
    marker.innerHTML = `<div class="tooltip">${loc.name}</div>`;
    marker.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLocation(loc.id);
    });
    mapInner.appendChild(marker);
  });

  const territorySvg = document.getElementById('territorySvg');

LOCATIONS.forEach(loc => {
  if (!loc.territory) return;
  const points = loc.territory.map(p => `${p.x},${p.y}`).join(' ');
  const territoryColor = loc.territoryColor || getComputedStyle(document.documentElement).getPropertyValue('--color-' + loc.type).trim();
  const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  polygon.setAttribute('points', points);
  polygon.setAttribute('fill', territoryColor);
  polygon.setAttribute('fill-opacity', '0.3');
  polygon.setAttribute('stroke', territoryColor);
  polygon.setAttribute('stroke-width', '0.4');
  polygon.classList.add('territory-shape');
  polygon.id = 'territory-' + loc.id;
  polygon.style.pointerEvents = 'auto';
  polygon.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleLocation(loc.id);
  });
  territorySvg.appendChild(polygon);
});

function applyCategoryFilter() {
  LOCATIONS.forEach(loc => {
    const marker = document.getElementById('marker-' + loc.id);
    if (marker) marker.classList.toggle('hidden-category', !activeCategories.has(loc.type));

    const territory = document.getElementById('territory-' + loc.id);
    if (territory) territory.classList.toggle('hidden-category', !activeCategories.has(loc.type));
  });
}

  function toggleLocation(id) {
    if (activeLocationId === id) {
      closePanel();
      return;
    }

    const loc = LOCATIONS.find(l => l.id === id);
if (!loc) return;

const isMobile = window.innerWidth <= 700;
currentZoom = isMobile ? 1.7 : 2.2;
const verticalTarget = isMobile ? 28 : 50;
baseOffsetX = (50 - loc.x);
baseOffsetY = (verticalTarget - loc.y);
panX = 0;
panY = 0;
updateTransform();

    const cat = CATEGORIES[loc.type];
    document.getElementById('infoSwatch').style.background = cat.color;
    document.getElementById('infoTypeLabel').textContent = cat.label;
    document.getElementById('infoName').textContent = loc.name;
    document.getElementById('infoOwner').textContent = loc.owner;
    document.getElementById('infoDescription').textContent = loc.description;

    const infoImage = document.getElementById('infoImage');
    if (loc.image) {
      infoImage.src = loc.image;
      infoImage.classList.add('show');
    } else {
      infoImage.src = '';
      infoImage.classList.remove('show');
    }

    const discordBtn = document.getElementById('infoDiscordBtn');
    const contactText = document.getElementById('infoContactText');

    if (loc.discordInvite) {
      discordBtn.href = loc.discordInvite;
      discordBtn.style.display = 'block';
      contactText.style.display = 'none';
    } else if (loc.contact) {
      contactText.textContent = 'Contact: ' + loc.contact;
      contactText.style.display = 'block';
      discordBtn.style.display = 'none';
    } else {
      discordBtn.style.display = 'none';
      contactText.style.display = 'none';
    }

    infoPanel.classList.add('open');
    backdrop.classList.add('active');
    activeLocationId = id;
  }

  function closePanel() {
    infoPanel.classList.remove('open');
    backdrop.classList.remove('active');
    currentZoom = 1;
    baseOffsetX = 0;
    baseOffsetY = 0;
    panX = 0;
    panY = 0;
    updateTransform();
    activeLocationId = null;
  }

  function updateTransform() {
    const tx = baseOffsetX + panX;
    const ty = baseOffsetY + panY;
    mapInner.style.transform = `scale(${currentZoom}) translate(${tx}%, ${ty}%)`;
  }

  backdrop.addEventListener('click', closePanel);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeLightbox();
      closePanel();
    }
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const infoImageEl = document.getElementById('infoImage');
  let lightboxOpen = false;

  infoImageEl.addEventListener('click', (e) => {
    e.stopPropagation();
    if (lightboxOpen) {
      closeLightbox();
      return;
    }
    lightboxImage.src = infoImageEl.src;
    lightbox.classList.add('open');
    lightboxOpen = true;
  });

  lightboxImage.addEventListener('click', closeLightbox);

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxOpen = false;
  }

  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let panStartX = 0, panStartY = 0;

  mapInner.addEventListener('pointerdown', (e) => {
    if (currentZoom <= 1) return;
    dragging = true;
    mapInner.classList.add('dragging');
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
    mapInner.setPointerCapture(e.pointerId);
  });

  mapInner.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const width = mapViewport.clientWidth || 1;
    const height = mapViewport.clientHeight || 1;
    const dxPct = ((e.clientX - dragStartX) / width) * 100 / currentZoom;
    const dyPct = ((e.clientY - dragStartY) / height) * 100 / currentZoom;
    panX = panStartX + dxPct;
    panY = panStartY + dyPct;
    updateTransform();
  });

  function endDrag() {
    dragging = false;
    mapInner.classList.remove('dragging');
  }
  mapInner.addEventListener('pointerup', endDrag);
  mapInner.addEventListener('pointercancel', endDrag);

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    searchDropdown.innerHTML = '';

    if (!q) {
      searchDropdown.classList.remove('show');
      return;
    }

    const matches = LOCATIONS.filter(loc => loc.name.toLowerCase().includes(q));

    if (matches.length === 0) {
      searchDropdown.classList.remove('show');
      return;
    }

    matches.forEach(loc => {
      const item = document.createElement('div');
      item.textContent = loc.name;
      item.addEventListener('click', () => {
        toggleLocation(loc.id);
        searchDropdown.classList.remove('show');
        searchInput.value = loc.name;
      });
      searchDropdown.appendChild(item);
    });

    searchDropdown.classList.add('show');
  });

  const MAP_SIZE = 4096;
const coordDisplay = document.getElementById('coordDisplay');
const mapImg = mapInner.querySelector('img');

mapViewport.addEventListener('mousemove', (e) => {
  const rect = mapImg.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;

  if (xPct < 0 || xPct > 100 || yPct < 0 || yPct > 100) return;

  const blockX = Math.round((xPct / 100) * MAP_SIZE - MAP_SIZE / 2);
  const blockZ = Math.round((yPct / 100) * MAP_SIZE - MAP_SIZE / 2);

  coordDisplay.textContent = `X: ${blockX}, Z: ${blockZ}`;
});

  mapViewport.addEventListener('mouseleave', () => {
    coordDisplay.textContent = 'X: --, Z: --';
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('searchResults').contains(e.target)) {
      searchDropdown.classList.remove('show');
    }
  });
